name: Security scan

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Repository and Kubernetes configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render manifests for scanning
        run: ./scripts/render-for-scan.sh .rendered.yaml

      - name: Scan committed files for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.69.3
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "1"

      - name: Validate Kubernetes schemas
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          release="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${release}/${archive}"
          curl --fail --location --silent --show-error --output CHECKSUMS "${release}/CHECKSUMS"
          grep " ${archive}$" CHECKSUMS | sha256sum --check
          tar -xzf "${archive}" kubeconform
          ./kubeconform \
            -kubernetes-version 1.34.0 \
            -strict \
            -summary \
            .rendered.yaml

      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .rendered.yaml
          version: v0.69.3
          severity: HIGH,CRITICAL
          format: table
          hide-progress: true
          exit-code: "1"
          skip-setup-trivy: true

  actions:
    name: GitHub Actions configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze workflows with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          version: v1.26.0
